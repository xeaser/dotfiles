# herdr configuration — managed in ~/dotfiles/herdr/config.toml
# Symlinked to ~/.config/herdr/config.toml by install.sh
# Docs: https://herdr.dev  |  Regenerate defaults: herdr --default-config
#
# Parallel-trial setup: herdr runs alongside tmux + superset (nothing removed).
# Launch a trial with `herdr` in Kitty; fall back with `tmux` or the Superset app.

onboarding = false

[theme]
name = "gruvbox"

auto_switch = false
[keys]
# Match muscle memory from tmux (prefix rebound Ctrl+b -> Ctrl+a).
prefix = "ctrl+a"

# Worktree management — the superset-replacement workflow.
# new_worktree defaults to prefix+shift+g; add open + remove (unset by default).
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+d"

[worktrees]
# Kept separate from ~/.superset/worktrees so the trial never touches
# superset-managed worktrees. Checkouts land at <dir>/<repo>/<branch-slug>.
directory = "~/.herdr/worktrees"

[ui.toast]
# Route agent state-change notifications to the outer terminal.
# Kitty supports terminal-native desktop notifications.
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
