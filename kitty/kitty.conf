include ./theme.conf

#font_family     FiraCode Nerd Font Mono
font_size       17

# Gruvbox glass: keep the theme's text colors, soften the window background.
background_opacity      0.82
background_blur         30
dynamic_background_opacity yes

window_margin_width     14
#background_image        /Users/zephyr/Downloads/Pers/download.jpeg
background_image_layout scaled
background_tint         0.97
background_tint_gaps    -10.0

window_border_width     3pt
active_border_color     #83a598

single_window_margin_width 0
enabled_layouts Tall, *
macos_option_as_alt yes
map f1 new_window_with_cwd
map f2 launch --cwd=current $EDITOR .
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_background      #1d2021
active_tab_background   #504945
active_tab_foreground   #fbf1c7
inactive_tab_background #1d2021
inactive_tab_foreground #a89984

#hide_window_decorations titlebar-only
confirm_os_window_close 0
scrollback_lines 10000
enable_audio_bell no
cursor_shape beam
url_style curly
